version: '3.8'

services:
  selenium-hub:
    image: selenium/hub:4.25.0
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"

  chrome-node:
    image: selenium/node-chrome:4.25.0
    container_name: chrome-node
    shm_size: '2gb'
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443

  firefox-node:
    image: selenium/node-firefox:4.25.0
    container_name: firefox-node
    shm_size: '2gb'
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443

  ats-tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ats-tests-runner
    depends_on:
      - chrome-node
      - firefox-node
    environment:
      - BROWSER=chrome
      - HEADLESS=true
      - GRID_URL=http://selenium-hub:4444
    volumes:
      - ../target/surefire-reports:/app/target/surefire-reports
      - ../allure-results:/app/allure-results
      - ../logs:/app/logs
      - ../screenshots:/app/screenshots
